# Runtime configuration. Thresholds, rates and input sizes live here, not in code.

source:
  mode: live              # live (camera / RTSP) | paced (file at real speed) | offline (file, no pauses)
  camera_id: cam-1        # goes into window.source of the scene description
  label: Камера 1         # the camera's name in Telegram messages (e.g. "Вхід")

analysis:
  fps: 10                 # fixed analysis rate, frames/s (not the camera rate); SPEC §6: 8–10
  window_s: 1.0           # one scene description per window

models:
  backend: openvino       # torch | openvino (run `sentinel export` first); default openvino since the quiet bench
                          # of 30.09: RTF@10 0.54 for this configuration (decision 30.09, report 03, item 6)
  device: cpu             # cpu | gpu (integrated Intel GPU, OpenVINO only)
  imgsz: 480              # people + pose input size (decision 29.09, docs/DECISIONS.md)
  threads: null           # torch intra-op threads; null = leave the Ultralytics default (8)
  people:
    source: detect        # detect: detector + ByteTrack, skeletons matched to tracks | pose: the pose model is tracked
    weights: weights/yolo11n.pt  # detector, used with source: detect (decision 30.09.4: people source)
    conf: 0.1             # low on purpose: ByteTrack also uses low-score boxes (Ultralytics track default)
    tracker: configs/bytetrack.yaml
  pose:
    weights: weights/yolo26n-pose.pt
    conf: 0.25
    # A skeleton is attached to one track (highest box IoU first) only if both hold:
    min_iou: 0.3          # box IoU between the skeleton's box and the track box
    min_inside: 0.8       # share of confident keypoints inside the track box expanded by box_margin
    keypoint_conf: 0.5    # a keypoint counts as confident from this score
    box_margin: 0.1       # expansion of the track box, share of its width/height per side

weapons:                  # weapon detector (session 02: docs/bench/weapons_2026-09-29.md); mode by the rule of
                          # decision 05.10: crops 320:2 RTF@10 1.07-1.81 on 6-20 people > 0.8 -> whole frame 480:2
  weights: weights/candidates/gh-halok600-weaponshield-yolov8s/best.pt
  mode: frame               # frame | crops (padded squares around tracked people — small weapons get larger)
  imgsz: 480
  conf: 0.30                # Sevilla Cam1+Cam5: frame recall 10.7 % at 1.3 % false frames
  every_n_frames: 2         # 1 or 2; in between the last boxes are kept
  record_conf: 0.05         # episode cache: the model scores boxes down to this for the baseline (aux only)
  crop_pad: 0.25            # crops mode: square side = longer person-box side x (1 + crop_pad)
  class_map: {pistol: gun, rifle: gun, gun: gun, knife: knife}

notify:
  incidents_jsonl: results/incidents.jsonl
  edit_interval_s: 10.0     # Telegram: at most one caption edit per incident this often

features:                 # person and pair features over a window (SPEC §4–5); units: person heights
  min_keypoint_conf: 0.5  # keypoints below this score are ignored
  hold_margin_h: 0.1      # "holds": weapon box expanded by this many heights must contain a wrist…
  hold_min_share: 0.4     # …in at least this share of the detector runs while the person is in view (min 1)
  weapon_max_height_h: 0.5  # a weapon box taller than this many person heights is implausible (decision 30.09.3)
  pair_max_distance_h: 2.0  # only pairs closer than this go into the scene description…
  max_pairs: 5            # …at most this many, nearest first
  contact_distance_h: 1.0 # a pair closer than this is in contact (duration_s)
  facing_min_offset_h: 0.03 # nose-to-shoulder-midpoint horizontal offset that shows which way a person faces
  smooth_points: 5        # keypoint trajectories: local least-squares fits over this many points…
  max_gap_s: 0.3          # …never across a gap without the person longer than this

motion:                   # pixel motion, independent of person detection (schema v3)
  max_width: 160          # grey frames shrunk to at most this width before differencing
  threshold: 15           # grey levels (0-255): a pixel changed by more than this counts in motion_area

context:
  zones: configs/zones.yaml

aggregator_a:               # A: a trained model if `model` is set, else the hand-set weights v0.1 below
  model: weights/aggregator_a/a_v1_1_all.json  # A v1.1, final for the experiment (frozen 01.10, sha256 5943d328…):
                            # LR on all RWF train windows but empty ones that do not move; no facing_close /
                            # weapon features (decisions 30.09, report 03)
  # risk = sigmoid(bias + Σ weights[f] · clip((x_f − mean_f) / scale[f], ±clip)); mean = 0 for hand-set weights.
  # A null feature takes its `neutral` value; explanations rank contributions against the neutral scene.
  bias: -1.5                # v0.1 (29.09): tuned on the sanity samples, see docs/DECISIONS.md
  clip: 5.0
  reason_min_contribution: 0.25  # explanations name features that add at least this much to the logit
  quiet_motion_area: 0.1    # τ_quiet, % of the frame: nobody detected and less motion than this -> risk 0 without
                            # computing (SPEC §5); 5th percentile of empty windows of RWF train fights (decision 30.09)
  weights:                  # v3 features (schema v3) get 0 until A is trained
    n_persons: 0.1
    crowd_motion: 0.8
    max_speed: 0.8
    pair_max_speed: 0.0
    max_limb_speed: 0.0
    max_limb_accel: 0.4
    max_pose_motion: 0.0
    max_person_motion: 0.0
    motion_energy: 0.0
    motion_area: 0.0
    min_distance_h: -1.0
    max_approach_speed: 0.6
    max_contact_s: 0.0      # calm groups stand close longer than fighters (window AUC 0.40)
    n_close_pairs: 0.3
    zone_prior: 1.0
    limb_accel_missing: 0.0
    no_persons: 0.0
  scale:                    # typical magnitude of each feature, in its own units
    n_persons: 5.0
    crowd_motion: 1.0       # heights/s
    max_speed: 2.0          # heights/s
    pair_max_speed: 2.0     # heights/s
    max_limb_speed: 2.0     # heights/s
    max_limb_accel: 20.0    # heights/s²
    max_pose_motion: 1.0    # heights/s
    max_person_motion: 20.0 # grey levels
    motion_energy: 10.0     # grey levels
    motion_area: 10.0       # % of the frame
    min_distance_h: 2.0     # heights
    max_approach_speed: 2.0 # heights/s
    max_contact_s: 5.0      # s
    n_close_pairs: 3.0
    zone_prior: 1.0
    limb_accel_missing: 1.0
    no_persons: 1.0
  neutral:                  # value of a missing feature = a calm scene
    n_persons: 0.0
    crowd_motion: 0.0
    max_speed: 0.0
    pair_max_speed: 0.0
    max_limb_speed: 0.0
    max_limb_accel: 0.0
    max_pose_motion: 0.0
    max_person_motion: 0.0
    motion_energy: 0.0
    motion_area: 0.0
    min_distance_h: 2.0     # nobody within the pair limit
    max_approach_speed: 0.0
    max_contact_s: 0.0
    n_close_pairs: 0.0
    zone_prior: 0.0
    limb_accel_missing: 0.0
    no_persons: 0.0
  zone_prior:               # added up: hours + expected density + zone type
    hours: {day: 0.0, night: 0.5}
    density: {low: 0.2, medium: 0.0, high: 0.0}
    type: {}

llm:                        # aggregator B (decision 01.10): gpt-oss-120b over OpenAI-compatible APIs, keys in .env
  provider: groq            # the one used; cerebras is the fallback for development
  reasoning_effort: low
  temperature: 0.0
  seed: 2026
  max_tokens: 1024          # reasoning + answer
  timeout_s: 8.0            # live: an answer later than this falls back to A for that window
  cache_dir: cache/llm
  providers:
    groq:
      base_url: https://api.groq.com/openai/v1
      model: openai/gpt-oss-120b
      key_env: GROQ_API_KEY
      rpm: 30               # free plan limits (Groq docs, 03.10)
      tpm: 8000
      rpd: 1000
      tpd: 200000
      price_in_per_m: 0.15  # USD per million tokens (Groq, 03.10)
      price_out_per_m: 0.60
    openrouter:             # one host pinned, no fallbacks: every answer of an experiment has one origin
      base_url: https://openrouter.ai/api/v1
      model: openai/gpt-oss-120b
      key_env: OPENROUTER_API_KEY
      reasoning_format: openrouter
      extra_body: {provider: {order: [deepinfra], allow_fallbacks: false, require_parameters: true}}
      price_in_per_m: 0.037 # DeepInfra (bf16) via OpenRouter, 03.10
      price_out_per_m: 0.17
    cerebras:
      base_url: https://api.cerebras.ai/v1
      model: gpt-oss-120b
      key_env: CEREBRAS_API_KEY
      rpm: 5                # free trial limits (Cerebras docs, 03.10); no key in .env yet
      tpm: 30000            # uncached tokens per minute
      rpd: null
      tpd: 1000000

aggregation:                # SPEC §3: A | B | cascade; switchable while running with /mode (Telegram)
  mode: A
  g_low: 0.5                # cascade grey zone of A's risk, chosen on val (decision 11.10): the best episode AUC
  g_high: 0.55              # of `sentinel eval cascade-grid` on the 120 B clips — 0.789, 30 % of windows to B

incidents:                  # incident state machine (SPEC §7)
  theta_high: 0.71          # risk that opens / keeps an alarm — A v1: 95 % of calm val windows are below
  theta_low: 0.65           # risk below which things calm down (hysteresis); with quiet_s: `sentinel eval fsm-tune`
                            # on compilations of val clips — 70 % of fights close within M + 5 s without flicker
  k: 3                      # ATTENTION -> ALARM: risk >= theta_high in k of the last n windows
  n: 5
  quiet_s: 5.0              # COOLDOWN -> NORMAL after this long below theta_low (M); decision 30.09, report 03, item 7
  merge_after_close_s: 30.0 # a new incident this soon after the previous one closed joins it…
  merge_participants_max_s: 120.0  # …as does one sharing participants this soon (decision 30.09.6)
  max_new_per_minute: 6     # more new incidents per minute are folded into one summary
  update_interval_s: 10.0   # at most one update event per incident this often
  weapon_confirm_windows: 2 # ALARM at once only if the same track holds a weapon this many windows in a row
  blur_faces: true
  output_dir: results/incidents

baselines:                  # SPEC §9: the two baselines of the experiment (session 03, step 6)
  weapon_conf: 0.30         # detector operating point (Sevilla Cam1+Cam5 frames, session 02); no pose, no confirmation
  motion_energy: 2.14       # grey levels, largest window of an episode; best episode F1 on our RWF val

bench:
  imgsz: [640, 480, 416]
  fps: [8, 10]
  warmup_frames: 10       # excluded from timings
  quiet:                  # `sentinel bench --quiet` (session 03): foreign load = busy tasks outside our processes
    start_limit: 1.5      # start when its 1-minute mean stays below this…
    hold_s: 120           # …for this many seconds, on mains power with the performance profile
    noisy_limit: 2.0      # a measurement during which the mean rose above this is noisy and repeated
    span_s: 60            # the mean is taken over this many seconds
