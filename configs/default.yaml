# Runtime configuration. Thresholds, rates and input sizes live here, not in code (CLAUDE.md).

source:
  mode: live              # live (camera / RTSP) | paced (file at real speed) | offline (file, no pauses)
  camera_id: cam-1        # goes into window.source of the scene description

analysis:
  fps: 10                 # fixed analysis rate, frames/s (not the camera rate); SPEC §6: 8–10
  window_s: 1.0           # one scene description per window

models:
  backend: torch          # torch | openvino (run `sentinel export` first); decision 30.09.1
  device: cpu             # cpu | gpu (integrated Intel GPU, OpenVINO only)
  imgsz: 480              # people + pose input size (decision 29.09, docs/DECISIONS.md)
  threads: null           # torch intra-op threads; null = leave the Ultralytics default (8)
  people:
    weights: weights/yolo26n.pt
    conf: 0.1             # low on purpose: ByteTrack also uses low-score boxes (Ultralytics track default)
    tracker: configs/bytetrack.yaml
  pose:
    weights: weights/yolo26n-pose.pt
    conf: 0.25
    # A skeleton is attached to one track (highest box IoU first) only if both hold:
    min_iou: 0.3          # box IoU between the skeleton's box and the track box
    min_inside: 0.8       # share of confident keypoints inside the track box expanded by box_margin
    keypoint_conf: 0.5    # a keypoint counts as confident from this score
    box_margin: 0.1       # expansion of the track box, share of its width/height per side

weapons:                  # weapon detector (session 02: docs/bench/weapons_2026-09-29.md; final choice pending)
  weights: weights/candidates/gh-halok600-weaponshield-yolov8s/best.pt
  mode: frame               # frame | crops (padded squares around tracked people — small weapons get larger)
  imgsz: 480
  conf: 0.30                # Sevilla Cam1+Cam5: frame recall 10.7 % at 1.3 % false frames
  every_n_frames: 2         # 1 or 2; in between the last boxes are kept
  crop_pad: 0.25            # crops mode: square side = longer person-box side x (1 + crop_pad)
  class_map: {pistol: gun, rifle: gun, gun: gun, knife: knife}

notify:
  incidents_jsonl: results/incidents.jsonl
  edit_interval_s: 10.0     # Telegram: at most one caption edit per incident this often

features:                 # person and pair features over a window (SPEC §4–5); units: person heights
  min_keypoint_conf: 0.5  # keypoints below this score are ignored
  hold_margin_h: 0.1      # "holds": weapon box expanded by this many heights must contain a wrist…
  hold_min_share: 0.4     # …in at least this share of the detector runs while the person is in view (min 1)
  weapon_max_height_h: 0.5  # a weapon box taller than this many person heights is implausible (decision 30.09.3)
  pair_max_distance_h: 2.0  # only pairs closer than this go into the scene description…
  max_pairs: 5            # …at most this many, nearest first
  contact_distance_h: 1.0 # a pair closer than this is in contact (duration_s)
  facing_min_offset_h: 0.03 # nose-to-shoulder-midpoint horizontal offset that shows which way a person faces

context:
  zones: configs/zones.yaml

aggregator_a:               # A v0 — hand-set weights (training comes after the episodes are built)
  # risk = sigmoid(bias + Σ weights[f] · clip((x_f − mean_f) / scale[f], ±clip)); mean = 0 for hand-set weights.
  # A null feature takes its `neutral` value; explanations rank contributions against the neutral scene.
  bias: -1.5                # v0.1 (29.09): tuned on the sanity samples, see docs/DECISIONS.md
  clip: 5.0
  reason_min_contribution: 0.25  # explanations name features that add at least this much to the logit
  weights:
    n_persons: 0.1
    crowd_motion: 0.8
    max_speed: 0.8
    max_limb_accel: 0.4
    min_distance_h: -1.0
    max_approach_speed: 0.6
    facing_close: 0.5
    max_contact_s: 0.0      # calm groups stand close longer than fighters (window AUC 0.40)
    n_close_pairs: 0.3
    weapon_visible: 0.8
    weapon_held: 2.0
    zone_prior: 1.0
    limb_accel_missing: 0.0
  scale:                    # typical magnitude of each feature, in its own units
    n_persons: 5.0
    crowd_motion: 1.0       # heights/s
    max_speed: 2.0          # heights/s
    max_limb_accel: 20.0    # heights/s²
    min_distance_h: 2.0     # heights
    max_approach_speed: 2.0 # heights/s
    facing_close: 1.0
    max_contact_s: 5.0      # s
    n_close_pairs: 3.0
    weapon_visible: 1.0
    weapon_held: 1.0
    zone_prior: 1.0
    limb_accel_missing: 1.0
  neutral:                  # value of a missing feature = a calm scene
    n_persons: 0.0
    crowd_motion: 0.0
    max_speed: 0.0
    max_limb_accel: 0.0
    min_distance_h: 2.0     # nobody within the pair limit
    max_approach_speed: 0.0
    facing_close: 0.0
    max_contact_s: 0.0
    n_close_pairs: 0.0
    weapon_visible: 0.0
    weapon_held: 0.0
    zone_prior: 0.0
    limb_accel_missing: 0.0
  zone_prior:               # added up: hours + expected density + zone type
    hours: {day: 0.0, night: 0.5}
    density: {low: 0.2, medium: 0.0, high: 0.0}
    type: {}

incidents:                  # incident state machine (SPEC §7)
  theta_high: 0.6           # risk that opens / keeps an alarm
  theta_low: 0.4            # risk below which things calm down (hysteresis)
  k: 3                      # ATTENTION -> ALARM: risk >= theta_high in k of the last n windows
  n: 5
  quiet_s: 10.0             # COOLDOWN -> NORMAL after this long below theta_low (M)
  merge_after_close_s: 30.0 # a new incident this soon after the previous one closed joins it…
  merge_participants_max_s: 120.0  # …as does one sharing participants this soon (decision 30.09.6)
  max_new_per_minute: 6     # more new incidents per minute are folded into one summary
  update_interval_s: 10.0   # at most one update event per incident this often
  weapon_override_margin: 0.1  # weapon in hand -> risk >= theta_high + margin
  weapon_confirm_windows: 2 # ALARM at once only if the same track holds a weapon this many windows in a row
  blur_faces: true
  output_dir: results/incidents

bench:
  imgsz: [640, 480, 416]
  fps: [8, 10]
  warmup_frames: 10       # excluded from timings
